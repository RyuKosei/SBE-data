embedding:
  primary_model: BAAI/bge-m3
  secondary_model: intfloat/multilingual-e5-large
  fallback_model: shibing624/text2vec-base-chinese
  batch_size: 64

scalar_judge:
  prompt_template: judge_scalar_v1
  max_retries: 2
  temperature: 0.0
  top_p: 1.0
  max_tokens: 256
  concurrency: 64

pairwise_judge:
  prompt_template: judge_pairwise_v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 128
  concurrency: 64
  comparisons:
    adjacent: true
    cross_level_pairs:
      - [0.0, 0.5]
      - [0.5, 1.0]
      - [0.25, 0.75]

metrics:
  report_bootstrap_ci: true
  bootstrap_iterations: 1000
  endpoint_attraction_middle_ratios: [0.25, 0.5, 0.75]
  endpoint_attraction_low: 0.15
  endpoint_attraction_high: 0.85

